name: Tuition V1 Production Candidate Windows EXE

on:
  push:
    branches:
      - "feat/tuition-v1-production-fresh-monthly"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    if: github.ref == 'refs/heads/feat/tuition-v1-production-fresh-monthly'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CenterManager
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: CenterManager/requirements*.txt
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Package production-mode candidate (not approved)
        run: python build_release.py
      - name: Verify source identity and encrypted DB exclusion
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $package = "release/CenterManager-v$version-windows-x64"
          $zip = "$package.zip"
          if (!(Test-Path $zip)) { throw "Candidate ZIP missing" }
          $manifest = Get-Content "$package/RELEASE_MANIFEST.json" -Raw | ConvertFrom-Json
          if ($manifest.source_commit -ne $env:GITHUB_SHA.ToLower()) {
            throw "Candidate source commit mismatch"
          }
          $sensitive = Get-ChildItem -Path $package -Recurse -File |
            Where-Object { $_.Name -in @("center.db","database_key.dpapi","git_config.dpapi") }
          if ($sensitive) { throw "Candidate package includes sensitive runtime data" }
          Write-Host "PRODUCTION MODE CANDIDATE ONLY, NO PRODUCTION APPROVAL: $env:GITHUB_SHA"
      - name: Upload Windows candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuitionV1-ProductionCandidate-Windows-${{ github.sha }}
          path: |
            CenterManager/release/*.zip
            CenterManager/release/*.zip.sha256
          if-no-files-found: error
