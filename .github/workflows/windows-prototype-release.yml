name: Windows Prototype Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-prototype"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CenterManager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: CenterManager/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run full test suite
        run: python -m pytest -q

      - name: Build Windows prototype
        run: python build_release.py

      - name: Verify release package
        shell: pwsh
        run: |
          $root = "release/CenterManager-v0.1.0-prototype-windows-x64"
          $zip = "$root.zip"
          $exe = "$root/CenterManager.exe"
          $runtime = "$root/runtime"
          $migrations = "$root/migrations"
          $alembic = "$root/alembic.ini"
          if (!(Test-Path $zip)) { throw "Release ZIP was not created: $zip" }
          if (!(Test-Path $exe)) { throw "Executable was not created: $exe" }
          if (!(Test-Path $runtime)) { throw "External runtime directory was not created: $runtime" }
          if (!(Test-Path $migrations)) { throw "Migration directory was not created: $migrations" }
          if (!(Test-Path "$migrations/env.py")) { throw "Migration env.py is missing" }
          if (!(Test-Path "$migrations/versions")) { throw "Migration versions directory is missing" }
          if (!(Test-Path $alembic)) { throw "Alembic config is missing: $alembic" }
          if ((Get-Item $exe).Length -le 0) { throw "Executable is empty" }

      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: CenterManager-v0.1.0-prototype-windows-x64
          path: CenterManager/release/CenterManager-v0.1.0-prototype-windows-x64.zip
          if-no-files-found: error
