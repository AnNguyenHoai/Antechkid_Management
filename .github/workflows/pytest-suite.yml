name: Pytest Suite

on:
  push:
    branches:
      - main_repos
  pull_request:
    branches:
      - main_repos

permissions:
  contents: read

jobs:
  pytest:
    name: Full pytest suite (Windows, shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    defaults:
      run:
        working-directory: CenterManager

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            CenterManager/requirements.txt
            CenterManager/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Configure Git identity for integration tests
        run: |
          git config --global user.name "CenterManager CI"
          git config --global user.email "ci@centermanager.invalid"

      - name: Run full pytest suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_pytest_shard.py --shard ${{ matrix.shard }} --count 3

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: CenterManager/pytest-report-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn

      - name: Upload UI visual regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-prod-10-visual-evidence-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: CenterManager/visual-regression-artifacts/ui_prod_10
          if-no-files-found: warn
