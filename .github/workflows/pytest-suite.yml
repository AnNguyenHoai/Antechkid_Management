name: Pytest Suite

on:
  push:
    branches:
      - main_repos
  pull_request:
    branches:
      - main_repos

permissions:
  contents: read

jobs:
  pytest:
    name: Full pytest suite (Windows, shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    defaults:
      run:
        working-directory: CenterManager

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            CenterManager/requirements.txt
            CenterManager/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Configure Git identity for integration tests
        run: |
          git config --global user.name "CenterManager CI"
          git config --global user.email "ci@centermanager.invalid"

      - name: RV-01 mutation-site AST scan (shard 0 only)
        if: matrix.shard == 0
        run: |
          python tools/audit_recovery_mutations.py --json rv01-mutation-sites.json
          python -c "import json,collections; d=json.load(open('rv01-mutation-sites.json',encoding='utf-8')); print('RV01_MUTATION_SCAN scanned_files='+str(d['scanned_files'])+' candidates='+str(d['candidate_calls'])+' parse_errors='+str(len(d['parse_errors']))); print('RV01_MUTATION_CATEGORIES '+json.dumps(dict(sorted(collections.Counter(x['category'] for x in d['sites']).items()))))"

      - name: Upload RV-01 mutation audit review queue
        if: matrix.shard == 0 && always()
        uses: actions/upload-artifact@v4
        with:
          name: rv01-mutation-sites-${{ github.run_id }}
          path: CenterManager/rv01-mutation-sites.json
          if-no-files-found: warn

      - name: RV-02 mirror latency microbenchmark (shard 0 only)
        if: matrix.shard == 0
        run: |
          python tools/benchmark_rv02_mirror.py --samples 50 --json rv02-mirror-benchmark.json

      - name: Upload RV-02 mirror latency benchmark
        if: matrix.shard == 0 && always()
        uses: actions/upload-artifact@v4
        with:
          name: rv02-mirror-benchmark-${{ github.run_id }}
          path: CenterManager/rv02-mirror-benchmark.json
          if-no-files-found: warn

      - name: Run full pytest suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_pytest_shard.py --shard ${{ matrix.shard }} --count 3

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: CenterManager/pytest-report-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn

      - name: Upload UI visual regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-prod-10-visual-evidence-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: CenterManager/visual-regression-artifacts/ui_prod_10
          if-no-files-found: warn
