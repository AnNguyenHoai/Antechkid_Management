name: Pytest Suite

on:
  push:
    branches:
      - main_repos
  pull_request:
    branches:
      - main_repos

permissions:
  contents: read

jobs:
  pytest:
    name: Full pytest suite (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: CenterManager

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            CenterManager/requirements.txt
            CenterManager/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Configure Git identity for integration tests
        run: |
          git config --global user.name "CenterManager CI"
          git config --global user.email "ci@centermanager.invalid"

      - name: Run full pytest suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest
          --tb=long
          --junitxml=pytest-report.xml
          --durations=50
          --timeout=120
          --timeout-method=thread

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ github.run_id }}
          path: CenterManager/pytest-report.xml
          if-no-files-found: warn
