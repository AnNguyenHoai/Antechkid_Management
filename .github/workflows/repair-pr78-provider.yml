name: Repair PR78 provider file

on:
  push:
    branches:
      - fix/collaboration-poller-git-concurrency

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/collaboration-poller-git-concurrency

      - name: Restore provider and apply concurrency patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD~2 -- CenterManager/src/centermanager/platform/synchronization/git_synchronization_provider.py
          python - <<'PY'
          from pathlib import Path
          p = Path("CenterManager/src/centermanager/platform/synchronization/git_synchronization_provider.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace("import tempfile\n", "import tempfile\nimport threading\n", 1)
          marker = "        self._lease_duration_seconds = 60\n"
          insert = marker + "\n        # Serialize Git subprocesses for this provider. The CollaborationPoller\n        # runs in a QThread while the application thread may access the same\n        # repository through CollaborationManager. Git operations on one local\n        # repository must not overlap. RLock permits nested provider calls.\n        self._git_command_lock = threading.RLock()\n"
          if "self._git_command_lock = threading.RLock()" not in s:
              s = s.replace(marker, insert, 1)
          old = "        result = subprocess.run(\n            [\"git\"] + args,\n            cwd=str(cwd),\n            capture_output=True,\n            text=True,\n            env=env,\n            check=False,\n        )"
          new = "        with self._git_command_lock:\n            result = subprocess.run(\n                [\"git\"] + args,\n                cwd=str(cwd),\n                capture_output=True,\n                text=True,\n                env=env,\n                check=False,\n            )"
          if old not in s:
              raise SystemExit("expected subprocess block not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Remove repair workflow
        run: rm .github/workflows/repair-pr78-provider.yml

      - name: Commit repaired branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CenterManager/src/centermanager/platform/synchronization/git_synchronization_provider.py .github/workflows/repair-pr78-provider.yml
          git commit -m "fix(sync): serialize Git access during collaboration polling"
          git push origin HEAD:fix/collaboration-poller-git-concurrency
